name: Mise à jour de la composition du CAC Small

on:
  schedule:
    # Chaque lundi à 05:20 UTC : Euronext révise l'indice chaque trimestre,
    # la liste est donc vérifiée chaque semaine et n'est modifiée que si elle a changé.
    - cron: "20 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests pdfplumber

      - name: Lire le PDF de composition d'Euronext
        run: python tools/update_universe.py

      - name: Enregistrer la nouvelle liste si elle a changé
        run: |
          if git diff --quiet -- univers.json && git ls-files --error-unmatch univers.json >/dev/null 2>&1; then
            echo "Composition inchangée."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add univers.json
            git commit -m "Composition du CAC Small mise à jour"
            git push
          fi
